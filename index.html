<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0b0f14; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    color: #d8dee4;
  }
  #landing {
    text-align: center; max-width: 380px; padding: 28px 32px;
    border: 1px solid #232a33; border-radius: 6px; background: #111620;
  }
  h1 { font-size: 19px; font-weight: 500; margin: 0 0 10px; }
  p { color: #8b95a1; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  .choices { display: flex; gap: 10px; justify-content: center; }
  .choices button {
    color: #d8dee4; font-size: 14px; background: transparent;
    border: 1px solid #2c3542; border-radius: 5px; padding: 9px 18px;
    cursor: pointer; font-family: inherit;
  }
  .choices button:hover { background: #1a2029; border-color: #3a4454; }

  #loading {
    display: none; text-align: center; font-size: 14px; color: #8b95a1;
  }
  .dots::after {
    content: ''; display: inline-block; width: 1.2em; text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; }
    75% { content: '...'; } 100% { content: ''; }
  }
  #videoWrap { display: none; position: fixed; inset: 0; background: black; z-index: 999; }
  #videoWrap iframe, #player { width: 100%; height: 100%; }
  #tapOverlay { display: none; position: fixed; inset: 0; z-index: 1000; background: transparent; cursor: pointer; }
</style>

<body>

<div id="landing">
  <h1>My story</h1>
  <p>Quick question: Are you a developer?</p>
  <div class="choices">
    <button onclick="unleash()">Yes</button>
    <button onclick="unleash()">No</button>
  </div>
</div>

<div id="loading"><span id="loadingText">Compiling your totka</span><span class="dots"></span></div>

<div id="videoWrap"><div id="player"></div></div>
<div id="tapOverlay"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var ytPlayer, ytReady = false, clicked = false;
  var playerReady = false, sequenceDone = false, revealed = false;

  var loadingLines = [
    "Processing your response",
    "Generating your totka",
    "Finalizing your result"
  ];

  function onYouTubeIframeAPIReady() { ytReady = true; }

  function unleash() {
    if (clicked) return;
    clicked = true;

    document.getElementById('landing').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    createPlayer();
    playLoadingSequence();

    setTimeout(function () { if (!revealed) reveal(); }, 6000);
  }

  function playLoadingSequence() {
    var i = 0;
    var textEl = document.getElementById('loadingText');
    function next() {
      if (i < loadingLines.length) {
        textEl.textContent = loadingLines[i];
        i++;
        setTimeout(next, 900);
      } else {
        sequenceDone = true;
        tryReveal();
      }
    }
    next();
  }

  function createPlayer() {
    if (!ytReady) { setTimeout(createPlayer, 100); return; }
    ytPlayer = new YT.Player('player', {
      videoId: 'Aq5WXmQQooo',
      width: '100%',
      height: '100%',
      playerVars: {
        autoplay: 1,
        controls: 0,
        rel: 0,
        playsinline: 1,
        modestbranding: 1
      },
      events: {
        'onReady': function () {
          playerReady = true;
          tryReveal();
        }
      }
    });
  }
  function tryReveal() {
    if (sequenceDone && playerReady) reveal();
  }

  function reveal() {
    if (revealed) return;
    revealed = true;

    document.getElementById('loading').style.display = 'none';
    var wrap = document.getElementById('videoWrap');
    wrap.style.display = 'block';

    if (ytPlayer) {
      try { ytPlayer.unMute(); } catch (err) {}
      try { ytPlayer.playVideo(); } catch (err) {}
    }

    var fs = wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.msRequestFullscreen;
    if (fs) fs.call(wrap).catch(function () {});

    document.getElementById('tapOverlay').style.display = 'block';
  }

  document.getElementById('tapOverlay').addEventListener('click', function () {
    if (ytPlayer) { ytPlayer.unMute(); ytPlayer.playVideo(); }
    this.style.display = 'none';
  });
</script>

</body>
